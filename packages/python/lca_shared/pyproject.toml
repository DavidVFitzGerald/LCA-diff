[project]
name = "lca-shared"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "SQLAlchemy==2.0.55",
  "psycopg[binary]==3.3.6",
  "loguru==0.8.0",
  "python-dotenv==1.2.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"
