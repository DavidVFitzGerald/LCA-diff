# Overlay selected only by guarded ./dev etl-* commands. Mock frontend stays independent.
x-etl: &etl
  build:
    context: .
    dockerfile: data_pipeline/Dockerfile
  init: true
  user: "${LCA_ETL_UID:-0}:${LCA_ETL_GID:-0}"
  working_dir: /workspaces/LCA-diff-AI-dev-project
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - .:/workspaces/LCA-diff-AI-dev-project
    - type: bind
      source: ${LCA_PRIVATE_INPUT_DIR:-./data/private/bafu-2026-v1/incoming}
      target: /inputs
      read_only: true
      bind:
        create_host_path: false
  environment: &etl-env
    LCA_DATABASE_URL: postgresql+psycopg://lca_import:local-import-only@postgres/lca
    LCA_TEST_DATABASE_URL: postgresql+psycopg://lca_migrator:local-migration-only@postgres/lca
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:local-airflow-only@airflow-postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /workspaces/LCA-diff-AI-dev-project/data_pipeline/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: maintainer:admin
    AIRFLOW__API_AUTH__JWT_SECRET: local-only-etl-jwt-secret-do-not-deploy
    AIRFLOW__CORE__FERNET_KEY: ${LCA_AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__LOGGING__LOGGING_LEVEL: WARNING
    UV_CACHE_DIR: /tmp/lca-uv-cache
    AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: "{{ ti.dag_id }}/{{ ti.run_id }}/{{ ti.task_id }}/{{ try_number }}.log"
services:
  etl:
    <<: *etl
    profiles: [etl]
    command: [sleep, infinity]
  airflow-postgres:
    profiles: [airflow]
    image: postgres:17-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    user: "999:999"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: local-airflow-only
      POSTGRES_DB: airflow
    volumes: [airflow-metadata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 2s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  airflow-init:
    <<: *etl
    profiles: [airflow]
    command: [bash, -c, "uv sync --frozen --all-packages && uv run --frozen --package lca-etl airflow db migrate"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
  airflow-api:
    <<: *etl
    profiles: [airflow]
    command: [bash, -c, "uv run --frozen --package lca-etl airflow api-server --port 8080"]
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8091}:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *etl
    profiles: [airflow]
    command: [bash, -c, "uv run --frozen --package lca-etl airflow scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-dag-processor:
    <<: *etl
    profiles: [airflow]
    command: [bash, -c, "uv run --frozen --package lca-etl airflow dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
volumes:
  airflow-metadata:
