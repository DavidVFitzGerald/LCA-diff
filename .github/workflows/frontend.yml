name: Frontend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    container:
      image: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Install matching browsers and OS dependencies from the pinned snapshot
        run: bash ../../.devcontainer/install-browsers.sh node_modules/.bin/playwright
      - name: Critical browser smoke in both projects
        if: github.event_name != 'workflow_dispatch'
        # The image runs as UID 0; GitHub's injected /github/home belongs to UID
        # 1001. Firefox requires the current user's actual, owned system home.
        env:
          HOME: /root
        run: npm run test:e2e -- --grep @smoke
      - name: Complete available frontend browser suite on request
        if: github.event_name == 'workflow_dispatch'
        env:
          HOME: /root
        run: npm run test:e2e
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-browser-failure
          path: apps/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  real-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LCA_APP_PROJECT: lca-l2-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Hosted runners are rootful: use Compose directly, as in etl.yml.
      - name: Start the isolated local application
        run: docker compose -p lca-l2-ci -f compose.app.yaml up --detach --build --wait
      - name: Verify API precision, authentication and both CORS origins
        run: docker compose -p lca-l2-ci -f compose.app.yaml --profile smoke run --rm --no-deps smoke
      - name: Build matching pinned browsers
        run: docker compose -p lca-l2-ci -f compose.app.yaml --profile e2e build e2e
      - name: Real Firebase, API and PostgreSQL browser smoke
        run: docker compose -p lca-l2-ci -f compose.app.yaml --profile e2e run --rm --no-deps e2e
      - name: Stop disposable stack
        if: always()
        run: docker compose -p lca-l2-ci -f compose.app.yaml down --volumes
