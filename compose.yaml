name: lca-diff-dev
services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    user: vscode
    working_dir: /workspaces/lca-diff
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: .
        target: /workspaces/lca-diff
    # Reserved for the later Vite server; currently no application listens here.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    security_opt:
      - no-new-privileges:true
